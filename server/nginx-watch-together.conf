server {
    listen 9444 ssl http2;
    server_name ext.namalkin.site;

    ssl_certificate /etc/letsencrypt/live/ext.namalkin.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ext.namalkin.site/privkey.pem;

    location ^~ /watch-together/api/ {
        proxy_pass http://127.0.0.1:8787/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /watch-together/api {
        return 308 /watch-together/api/;
    }

    location / {
        return 404;
    }
}
